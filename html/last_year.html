<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagājušā gada uzvarētāji</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/custom.js"></script>
    <script src="../js/navigation.js"></script>
    <script src="../js/winners.js"></script>
    <script src="../js/utils.js"></script>
</head>
<body>
    <h1>Pagājušā gada uzvarētāji</h1>

    <div class="logo-button">
        <a href="home.html">
            <img id="logoButtonImg" src="../images/sadancis.png" alt="Button" title="Home" />
        </a>
    </div>

    <div class="winners" id="winnersDisplay"></div>

    <div class="button">
    <button onclick="openPopup()">Pagājušā gada viktori</button>
    </div>
    <div id="editPopup" class="popup">
        <div class="popup-content">
            <h3>Rediģēt pagājušā gada uzvarētājus</h3>
            <form id="editWinnersForm" enctype="multipart/form-data" onsubmit="updateWinners(event)">
                <div class="form-group">
                    <label for="name1">1. uzvarētājs</label>
                    <input type="text" name="name1" id="name1" class="input-field" required>
                    <input type="file" name="image1" accept="image/*" class="file-input">
                </div>
                <div class="form-group">
                    <label for="name2">2. uzvarētājs</label>
                    <input type="text" name="name2" id="name2" class="input-field" required>
                    <input type="file" name="image2" accept="image/*" class="file-input">
                </div>
                <div class="form-group">
                    <label for="name3">3. uzvarētājs</label>
                    <input type="text" name="name3" id="name3" class="input-field" required>
                    <input type="file" name="image3" accept="image/*" class="file-input">
                </div>
                <div class="form-actions">
                    <button type="submit" class="save-button">Saglabāt izmaiņas</button>
                    <button type="button" class="cancel-button" onclick="closePopup()">Atcelt</button>
                </div>
            </form>
        </div>
    </div>
    

    <!-- Back Button -->
    <div class="button">
        <button onclick="window.location.href='home.html'">Atpakaļ</button>
    </div>
</body>
</html>
